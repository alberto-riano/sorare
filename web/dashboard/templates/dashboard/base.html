{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sorare Control Hub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dashboard/style.css' %}">
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <header class="site-header">
    <a class="brand" href="{% url 'index' %}">Sorare Command Deck</a>
    <nav>
      <a href="{% url 'telegram_alerts' %}">Alertas Telegram</a>
      <a href="{% url 'bid_scheduler' %}">Programar Puja</a>
      <a href="{% url 'sales_workbench' %}">Ventas</a>
    </nav>
  </header>

  <main class="page">
    {% if messages %}
      <section class="flash-list">
        {% for message in messages %}
          <article class="flash flash-{{ message.tags|default:'info' }}">{{ message }}</article>
        {% endfor %}
      </section>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
