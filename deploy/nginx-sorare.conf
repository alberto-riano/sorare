# Bloques `location` para servir Sorare en www.milesdepuntos.com/sorare
# ---------------------------------------------------------------------
# NO es un server nuevo. Copia estos bloques DENTRO del `server { ... }`
# que ya tienes para milesdepuntos.com (tu archivo shop.conf), junto a las
# demás `location`. Crochet-shop sigue respondiendo en `/` con normalidad.
#
# Después:  sudo nginx -t && sudo systemctl reload nginx

    # Estáticos de Sorare (más específico que /sorare/, va primero al hacer match)
    location /sorare/static/ {
        alias /home/ubuntu/sorare/web/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Redirige /sorare -> /sorare/ (para que la raíz funcione)
    location = /sorare {
        return 301 /sorare/;
    }

    # App de Sorare: quita el prefijo /sorare y lo pasa a su gunicorn.
    # Django reconstruye el prefijo gracias a DJANGO_FORCE_SCRIPT_NAME=/sorare.
    location /sorare/ {
        rewrite ^/sorare/(.*) /$1 break;
        proxy_pass http://unix:/run/sorare/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        client_max_body_size 25M;
    }
